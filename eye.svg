<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="outerBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="skyBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <g filter="url(#eyeGlow)">
    <!-- Outer Deep Blue Circle -->
    <circle cx="100" cy="100" r="92" fill="url(#outerBlue)" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2.5"/>
    
    <!-- White Circle -->
    <circle cx="100" cy="100" r="66" fill="#ffffff"/>
    <circle cx="100" cy="100" r="66" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Turquoise / Sky Blue Circle -->
    <circle cx="100" cy="100" r="44" fill="url(#skyBlue)"/>
    
    <!-- Black Pupil -->
    <circle cx="100" cy="100" r="22" fill="#020617"/>
    
    <!-- Specular Highlight Reflections -->
    <ellipse cx="88" cy="85" rx="9" ry="6" transform="rotate(-25 88 85)" fill="#ffffff" opacity="0.95"/>
    <circle cx="116" cy="116" r="3.5" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>
